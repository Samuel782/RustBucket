<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="860" height="470" rx="10" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="600" fill="#111827">La superficie vista dal driver</text>
<text x="20" y="49" font-size="11.5" fill="#6b7280">Schema logico, non la disposizione fisica. I codici esadecimali sono i gruppi degli ID dei pulsanti.</text>
<rect x="20" y="64" width="190" height="384" rx="8" fill="#f9fafb" stroke="#9ca3af"/>
<text x="115.0" y="86" font-size="13" font-weight="600" text-anchor="middle" fill="#111827">Striscia di canale × 24</text>
<text x="115.0" y="102" font-size="11" text-anchor="middle" fill="#6b7280">gruppi 00–17</text>
<rect x="32" y="114" width="166" height="38" rx="5" fill="#dcfce7" stroke="#166534"/>
<text x="115.0" y="137.0" font-size="11" text-anchor="middle" fill="#166534">Scribble strip, 4 caratteri</text>
<rect x="32" y="158" width="166" height="38" rx="5" fill="#dcfce7" stroke="#166534"/>
<text x="115.0" y="181.0" font-size="11" text-anchor="middle" fill="#166534">Ring V-Pot, 15 LED</text>
<rect x="32" y="202" width="166" height="38" rx="5" fill="#dbeafe" stroke="#1e40af"/>
<text x="115.0" y="225.0" font-size="11" text-anchor="middle" fill="#1e40af">V-Pot</text>
<rect x="32" y="246" width="166" height="48" rx="5" fill="#ede9fe" stroke="#5b21b6"/>
<text x="115.0" y="262" font-size="11" text-anchor="middle" fill="#5b21b6">Pulsanti con LED: Mute, Solo,</text>
<text x="115.0" y="276" font-size="11" text-anchor="middle" fill="#5b21b6">Select, Rec Arm, Insert, Auto…</text>
<rect x="32" y="300" width="166" height="38" rx="5" fill="#dcfce7" stroke="#166534"/>
<text x="115.0" y="323.0" font-size="11" text-anchor="middle" fill="#166534">Meter stereo, 14 LED per lato</text>
<rect x="32" y="344" width="166" height="38" rx="5" fill="#ede9fe" stroke="#5b21b6"/>
<text x="115.0" y="367.0" font-size="11" text-anchor="middle" fill="#5b21b6">Fader motorizzato, 10 bit</text>
<rect x="32" y="388" width="166" height="38" rx="5" fill="#dbeafe" stroke="#1e40af"/>
<text x="115.0" y="411.0" font-size="11" text-anchor="middle" fill="#1e40af">Sensore di tocco del fader</text>
<rect x="226" y="64" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="236" y="84" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">18</tspan>  Funzioni e automazione</text>
<text x="236" y="104" font-size="10.5" fill="#4c1d95">F1–F10, meter select, Write / Touch /</text>
<text x="236" y="119" font-size="10.5" fill="#4c1d95">Latch / Trim / Read, modificatori</text>
<rect x="436" y="64" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="446" y="84" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">19</tspan>  Finestre e navigazione</text>
<text x="446" y="104" font-size="10.5" fill="#4c1d95">Mix, Edit, preset di zoom, frecce,</text>
<text x="446" y="119" font-size="10.5" fill="#4c1d95">Counter Mode</text>
<rect x="646" y="64" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="656" y="84" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">1A</tspan>  Tastierino numerico</text>
<text x="656" y="104" font-size="10.5" fill="#4c1d95">cifre, operatori, Enter</text>
<rect x="226" y="162" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="236" y="182" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">1B</tspan>  Edit</text>
<text x="236" y="202" font-size="10.5" fill="#4c1d95">Shuffle / Slip / Spot / Grid, Cut, Copy,</text>
<text x="236" y="217" font-size="10.5" fill="#4c1d95">strumenti, gruppi, banchi</text>
<rect x="436" y="162" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="446" y="182" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">1C</tspan>  Trasporto</text>
<text x="446" y="202" font-size="10.5" fill="#4c1d95">Play, Stop, Record, Rew, FF,</text>
<text x="446" y="217" font-size="10.5" fill="#4c1d95">Loop, Scrub, Shuttle, Talkback</text>
<rect x="646" y="162" width="200" height="88" rx="6" fill="#ede9fe" stroke="#5b21b6"/>
<text x="656" y="182" font-size="12" font-weight="600" fill="#5b21b6"><tspan font-family="ui-monospace,Menlo,monospace">1D</tspan>  Assegnazione</text>
<text x="656" y="202" font-size="10.5" fill="#4c1d95">Mandate, pan, insert, input / output,</text>
<text x="656" y="217" font-size="10.5" fill="#4c1d95">monitor</text>
<rect x="226" y="260" width="200" height="66" rx="6" fill="#dcfce7" stroke="#166534"/>
<text x="236" y="284" font-size="12" font-weight="600" fill="#166534">Display del trasporto</text>
<text x="236" y="304" font-size="10.5" fill="#166534">8 cifre a 7 segmenti, con i punti</text>
<rect x="436" y="260" width="200" height="66" rx="6" fill="#dcfce7" stroke="#166534"/>
<text x="446" y="284" font-size="12" font-weight="600" fill="#166534">Meter dei bus</text>
<text x="446" y="304" font-size="10.5" fill="#166534">6 meter, 14 LED ciascuno</text>
<rect x="646" y="260" width="200" height="66" rx="6" fill="#dbeafe" stroke="#1e40af"/>
<text x="656" y="284" font-size="12" font-weight="600" fill="#1e40af">Jog / shuttle</text>
<text x="656" y="304" font-size="10.5" fill="#1e40af">encoder con passo fino a ±3</text>
<rect x="226" y="336" width="620" height="42" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
<text x="236" y="362" font-size="11.5" fill="#4b5563">Control room monitor e Utility: non inviano nulla su Ethernet</text>
<rect x="226" y="392" width="16" height="16" rx="3" fill="#dbeafe" stroke="#1e40af"/>
<text x="248" y="405" font-size="11.5" fill="#374151">banco → host</text>
<rect x="396" y="392" width="16" height="16" rx="3" fill="#dcfce7" stroke="#166534"/>
<text x="418" y="405" font-size="11.5" fill="#374151">host → banco</text>
<rect x="566" y="392" width="16" height="16" rx="3" fill="#ede9fe" stroke="#5b21b6"/>
<text x="588" y="405" font-size="11.5" fill="#374151">in entrambi i sensi</text>
</svg>
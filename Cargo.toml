[package]
name = "rustbucket-c24"
version = "0.1.0"
edition = "2024"
authors = ["Samuel Luggeri"]
description = "Independent driver for the Digidesign Control|24 control surface"
license = "MIT OR Apache-2.0"

[lib]
name = "rustbucket"

[dependencies]
pnet_datalink = { version = "0.35.0", optional = true }

[features]
default = ["net"]
# Raw Ethernet access for the `rustbucketd` binary. The library itself does no I/O.
net = ["dep:pnet_datalink"]

[[bin]]
name = "rustbucket"
path = "src/main.rs"

[[bin]]
name = "rustbucketd"
path = "src/bin/rustbucketd/main.rs"
required-features = ["net"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
